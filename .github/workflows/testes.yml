name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1' # toda segunda-feira

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci

      - name: Testes de API (Postman/Newman)
        run: npm run test:api

      - name: Validações SQL
        run: npm run test:sql

      - name: Verificadores e trava do pacote Claude Code
        run: npm run test:ia
